<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OnlyUs • {{ room_id }}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.5/socket.io.min.js"></script>
    <style>
        .tools-card{background:rgba(0,0,0,.25);border-radius:12px;padding:12px;margin-bottom:10px}
        .tools-card h3{margin:0 0 8px;font-size:.9rem}
        #sharedNotes{width:100%;border-radius:8px;border:none;padding:8px;resize:vertical;background:rgba(255,255,255,.08);color:inherit;box-sizing:border-box}
        .todo-add-row{display:flex;gap:6px}
        .todo-add-row input{flex:1;border-radius:8px;border:none;padding:8px;background:rgba(255,255,255,.08);color:inherit}
        .todo-list{list-style:none;padding:0;margin:8px 0 0}
        .todo-item{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:4px 0;font-size:.9rem}
        .todo-item.done{opacity:.55;text-decoration:line-through}
        .mood-row{display:flex;flex-wrap:wrap;gap:6px}
        .mood-btn{border:none;border-radius:999px;padding:6px 10px;cursor:pointer;background:rgba(255,255,255,.12);color:inherit}
        .mood-btn:disabled{opacity:.4;cursor:not-allowed}
        .topbar-actions{display:flex;align-items:center;gap:6px}
        .mini-btn{border:none;border-radius:8px;padding:6px 8px;cursor:pointer;background:rgba(255,255,255,.12);color:inherit;font-size:.8rem}
        .chat-input-row{display:flex;gap:6px;align-items:center}
        .chat-input-row input[type=text]{flex:1}
        .chat-img{max-width:100%;border-radius:10px;margin-top:4px;display:block}
        #voiceLiveStatus{font-size:.8rem;opacity:.8;margin:0 0 8px}
        #remoteAudios audio{display:none}
        .player-controls{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
        .ctrl-btn{border:none;border-radius:8px;padding:8px 10px;cursor:pointer;background:rgba(255,255,255,.12);color:inherit}
        .seek-area{flex:1;min-width:140px}
    </style>
</head>
<body class="room-page">
    <div class="bg-orbs">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>

    <header class="topbar">
        <div class="brand-mini"><span class="heart">✨</span><span>OnlyUs</span></div>
        <div class="online-status" id="onlineStatus">
            <span class="dot"></span>
            <span id="userCount">0/10</span>
        </div>
        <div class="topbar-actions">
            <button type="button" class="mini-btn" onclick="copyRoomCode()">📋 Code</button>
            <button type="button" class="mini-btn" onclick="leaveRoom()">Leave</button>
            <div class="user-badge" id="myName">{{ username }}</div>
        </div>
    </header>

    <main class="room-layout">
        <section class="player-section">
            <div class="player-card">
                <div class="now-playing" id="nowPlaying">
                    <div class="np-label">Now Playing</div>
                    <div class="np-title" id="npTitle">Nothing yet... search a song 🎵</div>
                </div>
                <div class="video-wrapper" id="videoWrapper">
                    <div id="player"></div>
                    <div class="player-placeholder" id="playerPlaceholder">
                        <div class="placeholder-icon">🎶</div>
                        <p>Search or paste a YouTube link</p>
                    </div>
                </div>
                <div class="player-controls">
                    <button class="ctrl-btn" id="btnPlayPause" title="Play/Pause">▶️</button>
                    <button class="ctrl-btn" id="btnBack10" title="-10 sec">⏪10</button>
                    <button class="ctrl-btn" id="btnFwd10" title="+10 sec">10⏩</button>
                    <button class="ctrl-btn" id="btnNext" title="Next in queue">⏭</button>
                    <div class="seek-area">
                        <input type="range" id="seekBar" min="0" max="100" value="0" step="0.1">
                        <div class="time-row">
                            <span id="currentTime">0:00</span>
                            <span id="duration">0:00</span>
                        </div>
                    </div>
                </div>
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="Search song or paste YouTube URL..." autocomplete="off">
                    <button id="searchBtn">Search</button>
                </div>
                <div class="search-results" id="searchResults"></div>
                <div class="tools-card" id="queueCard" style="margin-top:10px;">
                    <h3>Queue <span id="queueCount" style="opacity:0.7;font-weight:400;"></span></h3>
                    <ul id="queueList" class="todo-list"></ul>
                </div>
            </div>
            <div class="reactions-bar">
                <button class="react-btn" data-reaction="hug">🤗</button>
                <button class="react-btn" data-reaction="kiss">👋</button>
                <button class="react-btn" data-reaction="missyou">✨</button>
                <button class="react-btn" data-reaction="heart">👍</button>
            </div>
        </section>

        <section class="side-section">
            <div class="presence-card">
                <h3>Online now</h3>
                <div class="users-list" id="usersList"></div>
            </div>

            <div class="tools-card" id="liveVoiceCard">
                <h3>Live talk</h3>
                <p id="voiceLiveStatus">Mic off</p>
                <div class="mood-row">
                    <button type="button" class="mood-btn" id="micOnBtn">🎙 Mic On</button>
                    <button type="button" class="mood-btn" id="micMuteBtn" disabled>🔇 Mute</button>
                    <button type="button" class="mood-btn" id="micOffBtn" disabled>⏹ Off</button>
                </div>
                <div id="remoteAudios"></div>
            </div>

            <div class="tools-card">
                <h3>Mood</h3>
                <div class="mood-row">
                    <button type="button" class="mood-btn" data-mood="free">🟢 Free</button>
                    <button type="button" class="mood-btn" data-mood="busy">🟡 Busy</button>
                    <button type="button" class="mood-btn" data-mood="sleeping">😴 Sleeping</button>
                </div>
            </div>

            <div class="tools-card">
                <h3>Shared notes</h3>
                <textarea id="sharedNotes" rows="4" placeholder="Notes for everyone in this room..."></textarea>
            </div>

            <div class="tools-card">
                <h3>To-do</h3>
                <div class="todo-add-row">
                    <input type="text" id="todoInput" placeholder="Add item..." maxlength="200">
                    <button type="button" id="todoAddBtn">+</button>
                </div>
                <ul id="todoList" class="todo-list"></ul>
            </div>

            <div class="chat-card">
                <div class="chat-messages" id="chatMessages"></div>
                <div class="chat-input-row">
                    <input type="file" id="photoInput" accept="image/*" hidden>
                    <button type="button" class="mini-btn" id="photoBtn" title="Photo">📷</button>
                    <input type="text" id="chatInput" placeholder="Type a message..." maxlength="300" autocomplete="off">
                    <button id="sendBtn">➤</button>
                </div>
            </div>
        </section>
    </main>

    <div id="reactionOverlay"></div>
    <script>
        const ROOM_ID = "{{ room_id }}";
        const USERNAME = "{{ username }}";
    </script>
    <script src="{{ url_for('static', filename='js/room.js') }}"></script>
</body>
</html>
