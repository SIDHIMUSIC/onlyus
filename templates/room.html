<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OnlyUs • {{ room_id }}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.5/socket.io.min.js"></script>
</head>
<body class="room-page">
    <div class="bg-orbs">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>

    <header class="topbar">
        <div class="brand-mini">
            <span class="heart">✨</span>
            <span>OnlyUs</span>
        </div>
        <div class="online-status" id="onlineStatus">
            <span class="dot"></span>
            <span id="userCount">0/10</span>
        </div>
        <div class="topbar-actions">
            <button type="button" class="mini-btn" onclick="copyRoomCode()" title="Copy room code">📋 Code</button>
            <button type="button" class="mini-btn" onclick="leaveRoom()" title="Leave">Leave</button>
            <div class="user-badge" id="myName">{{ username }}</div>
        </div>
    </header>

    <main class="room-layout">
        <section class="player-section">
            <div class="player-card">
                <div class="now-playing" id="nowPlaying">
                    <div class="np-label">Now Playing</div>
                    <div class="np-title" id="npTitle">Nothing yet... search a song 🎵</div>
                </div>

                <div class="video-wrapper" id="videoWrapper">
                    <div id="player"></div>
                    <div class="player-placeholder" id="playerPlaceholder">
                        <div class="placeholder-icon">🎶</div>
                        <p>Search or paste a YouTube link</p>
                    </div>
                </div>

                <div class="player-controls">
                    <button class="ctrl-btn" id="btnPlayPause" title="Play/Pause">▶️</button>
                    <div class="seek-area">
                        <input type="range" id="seekBar" min="0" max="100" value="0" step="0.1">
                        <div class="time-row">
                            <span id="currentTime">0:00</span>
                            <span id="duration">0:00</span>
                        </div>
                    </div>
                </div>

                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="Search song or paste YouTube URL..." autocomplete="off">
                    <button id="searchBtn">Search</button>
                </div>

                <div class="search-results" id="searchResults"></div>
            </div>

            <div class="reactions-bar">
                <button class="react-btn" data-reaction="hug" title="Hug">🤗</button>
                <button class="react-btn" data-reaction="kiss" title="Hi">👋</button>
                <button class="react-btn" data-reaction="missyou" title="Wave">✨</button>
                <button class="react-btn" data-reaction="heart" title="Like">👍</button>
            </div>
        </section>

        <section class="side-section">
            <div class="presence-card">
                <h3>Online now</h3>
                <div class="users-list" id="usersList"></div>
            </div>

            <div class="chat-card">
                <div class="chat-messages" id="chatMessages"></div>
                <div class="chat-input-row">
                    <input type="text" id="chatInput" placeholder="Type a message..." maxlength="300" autocomplete="off">
                    <button id="sendBtn">➤</button>
                </div>
            </div>
        </section>
    </main>

    <div id="reactionOverlay"></div>

    <script>
        const ROOM_ID = "{{ room_id }}";
        const USERNAME = "{{ username }}";
    </script>
    <script src="{{ url_for('static', filename='js/room.js') }}"></script>
</body>
</html>
